<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Can't Think — video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1140; --bg2: #1b1f6b; --ink: #fff6e9; --ink-2: #c9c6f2;
    --orange: #ff8c2e; --yellow: #ffd23f; --pink: #ff5e8a; --cyan: #35d5f0;
    --mint: #4ae0a8; --purple: #8a6cff; --red: #ff4d5e; --navy: #262a7a; --navy-2: #3a3fa0; --grey: #8a8983;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05071f; color: var(--ink);
    font-family: Nunito, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%;
    background: #0f3326; overflow: hidden; }
  /* two background layers crossfade between forest locations; each drifts slowly so the frame is never still */
  .bg { position: absolute; inset: -4%; background: center / cover no-repeat; opacity: 0; transition: opacity 1.2s ease; will-change: transform;
    animation: drift 46s ease-in-out infinite alternate; }
  .bg.on { opacity: 1; }
  /* a far painting fades out toward the bottom, so its flat horizon melts into the dark behind the trees layer */
  .bg.far { -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 56%, rgba(0, 0, 0, .3) 72%, rgba(0, 0, 0, .1) 100%); mask-image: linear-gradient(180deg, #000 0%, #000 56%, rgba(0, 0, 0, .3) 72%, rgba(0, 0, 0, .1) 100%); }
  #bgB { animation-delay: -23s; }
  @keyframes drift { 0% { transform: scale(1.02) translate(0, 0); } 50% { transform: scale(1.03) translate(-.35%, .2%); } 100% { transform: scale(1.025) translate(.3%, -.15%); } }
  /* trees layer: the trunks, bushes and ground of the place, cut out so the sky behind moves at a different speed */
  #trees { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #trees .tl { position: absolute; inset: -5%; opacity: 0; transition: opacity 1.2s ease; will-change: transform; animation: treesDrift 38s ease-in-out infinite alternate; }
  #trees .tl.on { opacity: 1; }
  #trees .tl.b { animation-delay: -19s; }
  #trees .tl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 100%; animation: swayTrees 9s ease-in-out infinite alternate; filter: brightness(.9); }
  @keyframes treesDrift { 0% { transform: translate(0, 0) scale(1.03); } 100% { transform: translate(-1.4%, .6%) scale(1.06); } }
  @keyframes swayTrees { 0% { transform: skewX(calc(-.45deg * var(--g, 1))); } 100% { transform: skewX(calc(.45deg * var(--g, 1))); } }
  /* lights in the scenery that change brightness: a hollow's warm glow, fungi, the moon */
  #glow { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #glow .g { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); mix-blend-mode: screen; animation: glowA 3.1s ease-in-out infinite alternate, glowB 1.3s ease-in-out infinite alternate; }
  @keyframes glowA { 0% { opacity: .15; } 100% { opacity: 1; } }
  @keyframes glowB { 0% { transform: translate(-50%, -50%) scale(.92); } 100% { transform: translate(-50%, -50%) scale(1.08); } }
  /* parallax mid layer: bushes, vines and trunks that drift further than the backdrop and sway in the wind */
  #mid { position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0; transition: opacity 1.2s ease; }
  #mid.on { opacity: 1; }
  #mid .p { position: absolute; inset: -6%; will-change: transform; animation: midDrift 30s ease-in-out infinite alternate; transition: opacity 1.2s ease; }
  #mid .p.vines { animation-duration: 36s; animation-direction: alternate-reverse; }
  #mid .p.trunks { animation-duration: 42s; animation-delay: -12s; }
  #mid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.55) saturate(.9); }
  #mid .bushes img { transform-origin: 50% 100%; animation: swayB 6.5s ease-in-out infinite alternate; }
  #mid .vines img { transform-origin: 50% 0%; animation: swayV 8s ease-in-out infinite alternate; }
  #mid .trunks img { transform-origin: 50% 100%; animation: swayT 11s ease-in-out infinite alternate; }
  #mid .flip { transform: scaleX(-1); animation-name: midDriftF; }
  @keyframes midDrift { 0% { transform: translate(0, 0) scale(1.02); } 100% { transform: translate(-2.4%, 1%) scale(1.06); } }
  @keyframes midDriftF { 0% { transform: scaleX(-1) translate(0, 0) scale(1.02); } 100% { transform: scaleX(-1) translate(-2.4%, 1%) scale(1.06); } }
  @keyframes swayB { 0% { transform: skewX(calc(-1.6deg * var(--g, 1))) translateX(0); } 100% { transform: skewX(calc(1.6deg * var(--g, 1))) translateX(calc(14px * var(--g, 1))); } }
  @keyframes swayV { 0% { transform: skewX(calc(2deg * var(--g, 1))) translateY(0); } 100% { transform: skewX(calc(-2.2deg * var(--g, 1))) translateY(calc(10px * var(--g, 1))); } }
  @keyframes swayT { 0% { transform: skewX(calc(-.9deg * var(--g, 1))); } 100% { transform: skewX(calc(.9deg * var(--g, 1))); } }
  /* darken the forest so cream text and icons read on it */
  #shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(5, 22, 17, .62) 0%, rgba(5, 22, 17, .30) 40%, rgba(5, 22, 17, .22) 75%, rgba(5, 22, 17, .45) 100%); }
  #stars { position: absolute; inset: 0; pointer-events: none; }
  #root { position: absolute; inset: 0; z-index: 2; }
  /* leaves that sway at the corners, behind the slide content and the characters but in front of the backdrop */
  #fg { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #fg img { position: absolute; width: 1000px; height: 667px; filter: brightness(.62) saturate(.9); }
  #fg .l { left: -200px; bottom: -160px; transform-origin: 0% 100%; animation: swayL 7.5s ease-in-out infinite alternate; }
  #fg .r { right: -220px; top: -180px; transform-origin: 100% 0%; animation: swayR 9s ease-in-out infinite alternate; }
  #fg .wrap { position: absolute; inset: 0; animation: nearDrift 24s ease-in-out infinite alternate; }
  @keyframes nearDrift { 0% { transform: translate(0, 0); } 100% { transform: translate(-3.5%, 1.6%) scale(1.04); } }
  @keyframes swayL { 0% { transform: rotate(calc(-2.2deg * var(--g, 1))) translateX(0); } 100% { transform: rotate(calc(2deg * var(--g, 1))) translateX(calc(16px * var(--g, 1))); } }
  @keyframes swayR { 0% { transform: rotate(calc(2deg * var(--g, 1))) translateX(0); } 100% { transform: rotate(calc(-2.4deg * var(--g, 1))) translateX(calc(-18px * var(--g, 1))); } }
  /* characters */
  .scene > .cast { position: absolute; inset: 0; padding: 0; pointer-events: none; z-index: 3; }
  .cast .actor { position: absolute; }
  .cast .actor img { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 90%; }
  .scene { position: absolute; inset: 0; padding: 90px 120px; display: flex; flex-direction: column; }
  .scene > * { position: relative; }
  .kicker { display: inline-block; font-size: 28px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
    padding: 10px 26px; border-radius: 999px; background: var(--orange); color: #2a1200; margin-bottom: 26px; align-self: flex-start; }
  /* the section badge lives outside the slide, so it holds still while slides inside one section change */
  #kick { position: absolute; left: 120px; top: 90px; z-index: 4; pointer-events: none; }
  #kick.off { display: none; }
  .scene > .kicker.ph { visibility: hidden; }
  .kicker.pink { background: var(--pink); color: #3a0012; }
  .kicker.cyan { background: var(--cyan); color: #002a33; }
  .kicker.mint { background: var(--mint); color: #003a26; }
  h1 { font-size: 112px; line-height: 1; font-weight: 900; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 76px; line-height: 1.05; font-weight: 900; margin: 0 0 22px; letter-spacing: -.02em; max-width: 1500px; }
  .sub { font-size: 40px; font-weight: 700; color: var(--ink-2); margin: 0; max-width: 1400px; line-height: 1.3; }
  .hi { color: var(--yellow); } .hi-o { color: var(--orange); } .hi-p { color: var(--pink); } .hi-c { color: var(--cyan); } .hi-m { color: var(--mint); }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 10px; }
  .art svg { width: 100%; height: 100%; max-height: 640px; overflow: visible; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; flex: 1; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 800; padding: 14px 28px;
    border-radius: 999px; background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.14); }
  .pill i { width: 22px; height: 22px; border-radius: 50%; display: inline-block; background: var(--c); }
  svg text { font-family: Nunito, system-ui, sans-serif; font-weight: 900; }
  .word { display: inline-block; }
  .tb { transform-box: fill-box; transform-origin: center; }

  /* living background */
  @keyframes twinkle { 0%, 100% { opacity: .05; transform: scale(.6) translateY(0); } 50% { opacity: .9; transform: scale(1.4) translateY(-10px); } }
  @keyframes driftbg { 0% { transform: translate(0, 0); } 50% { transform: translate(-28px, 14px); } 100% { transform: translate(0, 0); } }
  @keyframes blobfloat { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(60px, -40px) scale(1.15); } 66% { transform: translate(-40px, 50px) scale(.9); } 100% { transform: translate(0, 0) scale(1); } }
  #stars .tw { animation: twinkle 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  #stars .drift { animation: driftbg 40s ease-in-out infinite; }
  #stars .blob { animation: blobfloat 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; filter: blur(40px); }
  /* caption (transcript) */
  #caption { position: absolute; left: 50%; bottom: 122px; z-index: 8; transform: translateX(-50%); max-width: 1600px;
    font-size: 26px; font-weight: 700; line-height: 1.3; color: var(--ink); text-align: center;
    background: rgba(5,7,31,.72); padding: 18px 30px; border-radius: 20px; z-index: 8; display: none; }

  /* controls */
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; z-index: 9; display: flex; align-items: center; gap: 22px;
    padding: 0 40px; background: linear-gradient(transparent, rgba(5,7,31,.85)); font-size: 22px; font-weight: 800; color: var(--ink-2);
    opacity: 1; transition: opacity .4s; }
  body.clean #bar, body.clean #hint, body.clean #scenename { opacity: 0; pointer-events: none; }
  #bar button { font: inherit; font-weight: 900; color: var(--ink); background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 10px 22px; cursor: pointer; }
  #bar button:hover { background: rgba(255,255,255,.18); }
  #track { flex: 1; height: 14px; background: rgba(255,255,255,.12); border-radius: 999px; position: relative; cursor: pointer; }
  #track .mark { position: absolute; top: -4px; width: 3px; height: 22px; background: rgba(255,255,255,.35); border-radius: 2px; }
  #track #fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--yellow); border-radius: 999px; width: 0; }
  #time { font-variant-numeric: tabular-nums; min-width: 150px; text-align: right; }
  #hint { position: absolute; left: 40px; top: 30px; font-size: 20px; color: var(--ink-2); opacity: .6; z-index: 9; }
  #scenename { position: absolute; right: 40px; top: 30px; font-size: 20px; color: var(--ink-2); opacity: .6; z-index: 9; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgA" class="bg"></div><div id="bgB" class="bg"></div><div id="shade"></div>
  <svg id="stars" viewBox="0 0 1920 1080"></svg>
  <div id="root"></div>
  <div id="kick"><span class="kicker"></span></div>
  <div id="trees"><div class="tl a"><img alt=""></div><div class="tl b"><img alt=""></div></div>
  <div id="glow"></div>
  <div id="mid"><div class="p bushes"><img src="img/mid-bushes.png" alt="" onerror="this.parentNode.style.display='none'"></div><div class="p vines"><img src="img/mid-vines.png" alt="" onerror="this.parentNode.style.display='none'"></div><div class="p trunks"><img src="img/mid-trunks.png" alt="" onerror="this.parentNode.style.display='none'"></div></div>
  <div id="fg"><div class="wrap"><img class="l" src="img/fg-leaves-left.png" alt="" onerror="this.style.display='none'"><img class="r" src="img/fg-leaves-right.png" alt="" onerror="this.style.display='none'"></div></div>
  <div id="caption"></div>
  <div id="hint">Space play/pause · ← → scene · K clean · F fullscreen · M sound effects · B music</div>
  <div id="scenename"></div>
  <div id="bar">
    <button id="bPlay">▶ Play</button>
    <button id="bPrev">◀</button><button id="bNext">▶</button>
    <div id="track"><div id="fill"></div></div>
    <div id="time">0:00 / 0:00</div>
  </div>
</div>

<script>
/* =====================================================================
   Tiny timeline engine. Every scene builds its DOM and declares animations
   with A(el, keyframes, {at, dur, ease}); the clock drives them all so
   pause, seek and scrubbing stay exact. tick(t) hooks handle procedural
   motion (dots travelling along paths).
   ===================================================================== */
const OVER = 'cubic-bezier(.34,1.56,.64,1)';   // bouncy overshoot
const OUT  = 'cubic-bezier(.22,1,.36,1)';      // smooth ease-out
const INOUT = 'cubic-bezier(.65,0,.35,1)';
const stage = document.getElementById('stage'), root = document.getElementById('root');
const PALETTE = { pink: '#ff5e8a', orange: '#ff8c2e', yellow: '#ffd23f', cyan: '#35d5f0', mint: '#4ae0a8', purple: '#8a6cff', red: '#ff4d5e', ink: '#fff6e9' };

let cur = { anims: [], ticks: [], cues: [], score: [], ci: 0 };
/* ---- sound cues. Every animation helper leaves a cue (what kind of motion, when); the player turns them
   into soft sound effects. A helper that makes its own cue wraps the calls inside it in hush(). ---- */
let hushed = 0;
const cue = (kind, at, o = {}) => { if (!hushed && at >= 0) cur.cues.push({ kind, at, ...o }); };
const hush = fn => { hushed++; try { return fn(); } finally { hushed--; } };
/* a sound with a meaning, at second `at` of the slide (see SOUND EFFECTS). st(n) is the rate that plays it n semitones higher */
const snd = (name, at, rate = 1, vol = 1) => { cur.snd.push({ at, name, rate, vol }); }, st = n => 2 ** (n / 12);
const shift = tf => { const m = /translate[XY]?\(\s*(-?[\d.]+)(px|%)?(?:\s*,\s*(-?[\d.]+)(px|%)?)?/.exec(tf || ''); if (!m) return 0; const k = u => u === '%' ? 3 : 1; return Math.hypot(+m[1] * k(m[2]), +(m[3] || 0) * k(m[4])); };
/* what a set of keyframes does, judged from its first and last frame */
function motionOf(kf) {
  if (!Array.isArray(kf) || kf.length < 2) return null;
  const a = kf[0], b = kf[kf.length - 1], o0 = a.opacity, o1 = b.opacity;
  if (o0 !== undefined && +o0 === 0 && +o1 > 0) return /scale\(\s*(0|\.[0-5])/.test(a.transform || '') ? 'pop' : shift(a.transform) > 20 ? 'rise' : 'in';
  if (o1 !== undefined && +o1 === 0 && (o0 === undefined || +o0 > 0)) return 'out';
  if (Math.abs(shift(a.transform) - shift(b.transform)) > 80) return 'move';
  return null;
}
const SNS = 'http://www.w3.org/2000/svg';
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // deterministic, so frames are reproducible
function A(el, kf, { at = 0, dur = .6, ease = OUT, iter = 1, composite = 'replace', fill = 'both' } = {}) {
  if (!el) return;
  const a = el.animate(kf, { delay: at * 1000, duration: dur * 1000, easing: ease, fill, iterations: iter, composite });
  if (iter === 1 && composite === 'replace') { const k = motionOf(kf); if (k) cue(k, at, { dur }); }
  a.pause(); a.currentTime = 0; cur.anims.push(a); return a;
}
/* squash-and-stretch pop: overshoot wide, rebound tall, settle */
const pop = (el, at, dur = .7, rot = 8) => A(el, [
  { opacity: 0, transform: `scale(0) rotate(${-rot}deg)`, offset: 0 },
  { opacity: 1, transform: `scale(1.28, .78) rotate(${rot * .4}deg)`, offset: .42 },
  { opacity: 1, transform: `scale(.88, 1.14) rotate(${-rot * .25}deg)`, offset: .62 },
  { opacity: 1, transform: `scale(1.06, .96) rotate(${rot * .1}deg)`, offset: .8 },
  { opacity: 1, transform: 'scale(1) rotate(0deg)', offset: 1 }], { at, dur, ease: OUT });
/* slide up with a bounce and a tiny tilt */
const rise = (el, at, dur = .7) => A(el, [
  { opacity: 0, transform: 'translateY(70px) scale(.92) rotate(-1.5deg)', offset: 0 },
  { opacity: 1, transform: 'translateY(-14px) scale(1.03) rotate(.8deg)', offset: .55 },
  { opacity: 1, transform: 'translateY(5px) scale(.99) rotate(-.3deg)', offset: .8 },
  { opacity: 1, transform: 'translateY(0) scale(1) rotate(0)', offset: 1 }], { at, dur, ease: OUT });
/* idle wobble: additive rotate + breathe, desynced per element */
function wobble(el, at = 0, deg = 2.5, amp = .035, _c) {
  const period = 2.2 + rnd() * 1.6, ph = rnd() * period;
  return A(el, [{ transform: `rotate(${-deg}deg) scale(${1 - amp})` }, { transform: `rotate(${deg}deg) scale(${1 + amp})` }, { transform: `rotate(${-deg}deg) scale(${1 - amp})` }],
    { at: at - ph, dur: period, iter: Infinity, ease: INOUT, composite: 'add', fill: 'forwards' });
}
/* particle burst at an SVG element's centre (or explicit {svg,x,y}) */
function burst(target, at, color = '#ffd23f', n = 10, size = 7, dist = 70) {
  let svg, x, y; if (!target) return;
  if (target instanceof SVGElement) { svg = target.ownerSVGElement || target; ({ x, y } = centerOf(target)); }
  else ({ svg, x, y } = target);
  if (!svg) return;
  const g = document.createElementNS(SNS, 'g'); g.setAttribute('pointer-events', 'none'); svg.appendChild(g);
  cue('sparkle', at); hushed++;
  for (let i = 0; i < n; i++) {
    const c = document.createElementNS(SNS, 'circle'); const a = (i / n) * Math.PI * 2 + rnd() * .5, d = dist * (.6 + rnd() * .7), r = size * (.5 + rnd());
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); c.setAttribute('fill', color); c.classList.add('tb'); g.appendChild(c);
    A(c, [{ opacity: 0, transform: 'translate(0,0) scale(.3)', offset: 0 }, { opacity: 1, transform: `translate(${Math.cos(a) * d * .5}px, ${Math.sin(a) * d * .5}px) scale(1.2)`, offset: .3 },
          { opacity: 0, transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(0)`, offset: 1 }], { at, dur: .55 + rnd() * .25, ease: OUT });
  }
  hushed--;
}
/* no screen shake: the frame never moves. Impacts are carried by bursts and the element's own squash. */
function shake() {}
/* trace an arrow path slowly with a leading dot, so it visibly travels instead of appearing */
function trace(s, path, at, dur = 1.4, color = '#ff4d5e') {
  cue('draw', at, { dur });
  hush(() => { draw(path, at, dur); const d = mk('circle', { r: 11, fill: color }); d.style.opacity = 0; path.parentNode.appendChild(d);
    travel(d, path, { at, dur, loop: false, trail: 3 }); }); return at + dur;
}
/* pop + burst in one call, for SVG elements */
function popB(el, at, color = '#ffd23f', dur = .7) { pop(el, at, dur); burst(el, at + dur * .3, color); }
const fade = (el, at, dur = .5, from = 0, to = 1) => A(el, [{ opacity: from }, { opacity: to }], { at, dur, ease: 'linear' });
function draw(path, at, dur = 1) {
  path.setAttribute('pathLength', 1); path.style.strokeDasharray = '1 1'; cue('draw', at, { dur });
  return A(path, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { at, dur, ease: INOUT });
}
function pulse(el, at, period = 2, from = .5, to = 1) {
  return A(el, [{ opacity: from }, { opacity: to }, { opacity: from }], { at, dur: period, ease: INOUT, iter: Infinity, fill: 'forwards' });
}
function bob(el, at = 0, period = 3.4, px = 14) {
  return A(el, [{ transform: 'translateY(0)' }, { transform: `translateY(-${px}px)` }, { transform: 'translateY(0)' }], { at: at - rnd() * period, dur: period, iter: Infinity, ease: INOUT, composite: 'add', fill: 'forwards' });
}
/* gentle breathing for groups of nodes, staggered */
function breathe(el, at, i = 0, amp = .1) { return A(el, [{ transform: 'scale(1)' }, { transform: `scale(${1 + amp})` }, { transform: 'scale(1)' }], { at: at - (i * .37) % 1.8, dur: 1.8, iter: Infinity, ease: INOUT, composite: 'add', fill: 'forwards' }); }
/* dot travelling along an SVG path between start and end seconds (repeating with period) */
function travel(dot, path, { at = 0, dur = 2, loop = true, until = Infinity, trail = 4 } = {}) {
  const len = path.getTotalLength(); const r = +dot.getAttribute('r') || 8; if (!loop) cue('move', at, { dur });
  const tails = []; for (let k = 1; k <= trail; k++) { const c = dot.cloneNode(false); c.setAttribute('r', r * (1 - k / (trail + 1))); c.style.opacity = 0; dot.parentNode.insertBefore(c, dot); tails.push(c); }
  cur.ticks.push(t => {
    const hide = () => { dot.style.opacity = 0; tails.forEach(c => c.style.opacity = 0); };
    if (t < at || t > until) return hide();
    let p = (t - at) / dur; if (loop) p = p % 1; else if (p > 1) return hide();
    const put = (el, pp, op) => { if (pp < 0) { el.style.opacity = 0; return; } const pt = path.getPointAtLength(pp * len); el.setAttribute('cx', pt.x); el.setAttribute('cy', pt.y); el.style.opacity = op; };
    put(dot, p, 1); tails.forEach((c, k) => put(c, p - (k + 1) * .035 * (2 / dur), .6 - k * .12));
  });
}
/* word-by-word headline reveal */
function words(el, at, step = .08) {
  const walk = n => {
    [...n.childNodes].forEach(c => {
      if (c.nodeType === 3) {
        const frag = document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(w => {
          if (!w) return;
          if (/^\s+$/.test(w)) { frag.appendChild(document.createTextNode(w)); return; }
          const s = document.createElement('span'); s.className = 'word'; s.textContent = w; frag.appendChild(s);
        });
        n.replaceChild(frag, c);
      } else if (c.nodeType === 1) walk(c);
    });
  };
  walk(el);

/* ---------- 9 PIPELINE ---------- */

  cur.ticks.push(t => nodes[4].forEach((c, i) => { let e = 0; for (let k = beats ? -1 : 0; k < 8; k++) { const d = t - arrive(k); if (d >= 0 && d < 1.4 && win(k) === i) e = Math.max(e, Math.exp(-d / .45)); }

      const first = beats && t < T0, k = first ? -1 : Math.floor((t - T0) / 3.2), local = first ? t - (beats[L + 1] - .6) : ((t - T0) % 3.2) - L * .6;

    /* text comes out of the spout a word at a time: each word squeezes out, swings over to the right and takes its place in a line.

/* ---------- OLD IDEAS: the concepts behind a brain that is grown, not drawn ---------- */
const K4 = ['Old ideas', 'mint', 'forest-dawnedge'];
/* reference cards: who and when, stacked on the right, popping in one by one */
const REFS = (list) => list.map(([who, what, yr], i) => `<g transform="translate(1110 ${40 + i * 150})"><g class="ref tb"><rect width="540" height="124" rx="26" fill="#fff6e9"/>

/* 1. breed what you can't draw */
S('Breed what you cannot draw', 15, `None of this is new. If you want to build a mind, something whose structure and workings you cannot specify in advance, you have to stop trying to design it by hand. Instead, you turn to nature's oldest method: evolution and genetics. Generate many random variants, keep the ones that perform best, and let their offspring inherit those traits, with small mutations. Researchers have evolved programs, virtual creatures, and even the wiring of neural networks this way for decades.`,
  ...K4, `Don't design it. <span class="hi-o">Evolve it.</span>`,
  `<g class="intro">
     <g class="ibrain tb"><image href="img/icon-brain-mint.png" x="300" y="80" width="340" height="340"/></g>
     <text class="iq tb" x="250" y="150" font-size="110" fill="#8a6cff" text-anchor="middle">?</text><text class="iq tb" x="700" y="120" font-size="80" fill="#8a6cff" text-anchor="middle">?</text><text class="iq tb" x="690" y="420" font-size="90" fill="#8a6cff" text-anchor="middle">?</text>
     <g class="idrop"><g class="iruler tb"><image href="img/icon-ruler.png" x="330" y="110" width="280" height="280"/></g></g>
     <g class="idna tb"><image href="img/icon-dna.png" x="20" y="130" width="240" height="240"/></g>
     <g class="itree tb"><image href="img/icon-tree.png" x="690" y="120" width="250" height="250"/></g>
     <text class="il1" x="800" y="420" font-size="28" fill="#4ae0a8" text-anchor="middle">evolution</text><text class="il2" x="140" y="420" font-size="28" fill="#ff5e8a" text-anchor="middle">genetics</text></g><g class="pop"></g>${REFS([['John Holland', 'genetic algorithms', 1975], ['Karl Sims', 'evolved virtual creatures', 1994], ['Kenneth Stanley', 'NEAT, evolving networks', 2002]])}`,
  (s, svg) => {
    /* a population of little random networks; each generation the worst half dies and the survivors' mutated copies take their place,
       and without anyone drawing it, a shape emerges */
    /* "If you want to build a mind": the brain; "whose structure and workings you cannot specify in advance": question marks around it */
    const intro = q(s, '.intro'), ib = q(s, '.ibrain'); popB(ib, 2.5, '#4ae0a8', .7); breathe(ib, 3.3, 0, .04);
    qa(s, '.iq').forEach((m, i) => { hush(() => pop(m, 3.6 + i * .5, .5)); wobble(m, 4.2 + i * .5, 6, .06); }); snd('ask', 3.6);
    /* "you have to stop trying to design it by hand": a ruler is laid on it, then dropped */
    popB(q(s, '.iruler'), 7.5, '#ffd23f', .6); wobble(q(s, '.iruler'), 8.2, 3, .02);
    hush(() => { qa(s, '.iq').forEach(m => A(m, [{ opacity: 1 }, { opacity: 0 }], { at: 9.3, dur: .4, fill: 'forwards' }));
      A(q(s, '.idrop'), [{ opacity: 1, transform: 'translate(0px, 0px) rotate(0deg)' }, { opacity: 1, transform: 'translate(20px, 110px) rotate(25deg)', offset: .5 }, { opacity: 0, transform: 'translate(50px, 300px) rotate(55deg)' }], { at: 9.4, dur: .9, ease: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' }); });
    snd('down', 9.5, 1, .8);
    /* "nature's oldest method: evolution and genetics" */
    popB(q(s, '.itree'), 13.4, '#4ae0a8', .7); hush(() => rise(q(s, '.il1'), 13.6)); snd('chord', 13.5, 1, .8);
    popB(q(s, '.idna'), 14.1, '#ff5e8a', .7); hush(() => rise(q(s, '.il2'), 14.3)); snd('ding', 14.2, st(5), .8);
    A(q(s, '.idna'), [{ transform: 'rotate(0deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(0deg)' }], { at: 14.9, dur: 2, composite: 'add' });
    /* it makes room for the population */
    hush(() => A(intro, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.85)' }], { at: 15.2, dur: .5, ease: INOUT, fill: 'forwards' }));
    intro.style.transformOrigin = '470px 250px';
    const G = q(s, '.pop'), N = 12, cols = ['#35d5f0', '#ff8c2e', '#ff5e8a', '#ffd23f', '#4ae0a8', '#8a6cff'];
    const target = [0, 1, 2, 3, 4].map(k => { const a = -Math.PI / 2 + k * 4 * Math.PI / 5; return [Math.cos(a) * 52, Math.sin(a) * 52]; });
    const err = sh => sh.reduce((e, p, k) => e + Math.hypot(p[0] - target[k][0], p[1] - target[k][1]), 0);
    const mut = (sh, m) => sh.map(p => [p[0] + (rnd() - .5) * m, p[1] + (rnd() - .5) * m]);
    let popn = Array.from({ length: N }, (_, i) => ({ sh: target.map(() => [(rnd() - .5) * 120, (rnd() - .5) * 120]), c: cols[i % cols.length] }));
    const gens = [popn.map(o => ({ ...o }))], deaths = [];
    const KEEP = 4; for (let g = 0; g < 14; g++) { const ranked = popn.map((o, i) => [err(o.sh), i]).sort((a, b) => a[0] - b[0]), dead = new Set(ranked.slice(KEEP).map(r => r[1])), live = ranked.slice(0, KEEP).map(r => r[1]);
      deaths.push(dead); popn = popn.map((o, i) => dead.has(i) ? (() => { const par = popn[live[Math.floor(rnd() * live.length)]]; return { sh: mut(par.sh, Math.max(6, 50 - g * 3)), c: par.c, born: g + 1 }; })() : o); gens.push(popn.map(o => ({ ...o }))); }
    const cells = Array.from({ length: N }, (_, i) => { const g = mk('g'); g.setAttribute('transform', `translate(${120 + (i % 4) * 240} ${90 + Math.floor(i / 4) * 175})`); G.appendChild(g);
      const line = mk('polygon', { fill: 'none', 'stroke-width': 6, 'stroke-linejoin': 'round' }), dots = target.map(() => { const d = mk('circle', { r: 9 }); g.appendChild(d); return d; }); g.insertBefore(line, g.firstChild);
      const x = mk('path', { d: 'M-34 -34 L 34 34 M 34 -34 L -34 34', stroke: '#ff4d5e', 'stroke-width': 10, 'stroke-linecap': 'round', opacity: 0 }); g.appendChild(x); return { g, line, dots, x }; });
    /* the random versions trickle in on "make many random versions"; the first cull is on "keep the ones that work" */
    const IN = 15.6, T0 = 17.6, GEN = .7, NG = 14, ease = u => u * u * (3 - 2 * u);
    cells.forEach((c, i) => { if (!(i % 2)) cue('pop', IN + i * .2); });
    /* a soft blip as each new generation is born, climbing as the shape gets closer; later generations only every second time */
    [0, 1, 2, 3, 5, 7, 9, 11, 13].forEach((g, k) => snd('blip', T0 + (g + .72) * GEN, st([0, 2, 4, 7, 9, 12, 14, 16, 19][k]), .55));
    cur.ticks.push(t => {
      const gt = (t - T0) / GEN, gi = Math.max(0, Math.min(NG - 1, Math.floor(gt))), ph = t < T0 ? -1 : gt - gi, last = gt >= NG;
      cells.forEach((c, i) => { const now = gens[last ? NG : gi][i], nxt = gens[Math.min(NG, gi + 1)][i], dying = !last && ph >= 0 && deaths[gi].has(i);
        let sc = t < T0 ? ease(Math.max(0, Math.min(1, (t - IN - i * .2) / .5))) : 1, op = 1, sh = now.sh, col = now.c, xo = 0;
        if (dying) { if (ph < .45) { xo = Math.min(1, (ph - .15) / .1); } else if (ph < .7) { const k = (ph - .45) / .25; sc = 1 - ease(k); op = 1 - k; xo = 1 - k; } else { const k = ease((ph - .7) / .3); sc = k; op = k; sh = nxt.sh; col = nxt.c; } }
        c.g.setAttribute('transform', `translate(${120 + (i % 4) * 240} ${90 + Math.floor(i / 4) * 175}) scale(${Math.max(.001, sc)})`); c.g.setAttribute('opacity', op);
        c.line.setAttribute('points', sh.map(p => p.join(',')).join(' ')); c.line.setAttribute('stroke', col);
        c.dots.forEach((d, k) => { d.setAttribute('cx', sh[k][0]); d.setAttribute('cy', sh[k][1]); d.setAttribute('fill', col); }); c.x.setAttribute('opacity', Math.max(0, xo)); });
    });
    refsIn(s, [25.5, 26.5, 28.8]);   /* "programs, virtual creatures, and even the wiring of neural networks" */
  }, '0 0 1680 600');

/* 2. a network that never stops */
S('A network that never stops', 13, `A brain-like network shouldn't run once and stop. In a recurrent network every signal can loop back, so activity keeps circulating after the input is gone. A pattern can stay alive in those loops, and the network can follow things that unfold over time.`,
  ...K4, `A network that <span class="hi-p">never stops.</span>`,
  `<g class="inp"><rect x="20" y="268" width="150" height="64" rx="32" fill="#35d5f0"/><path d="M178 300 H 250" stroke="#35d5f0" stroke-width="10" stroke-linecap="round"/><path d="M238 286 l 16 14 l -16 14" stroke="#35d5f0" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
   <g class="net"></g>${REFS([['John Hopfield', 'memories in loops', 1982], ['Jeffrey Elman', 'finding structure in time', 1990]])}`,
  (s, svg) => {
    const net = q(s, '.net'), C = { x: 560, y: 300 }, n = 8, R = 210, cols = ['#ff5e8a', '#35d5f0', '#ffd23f', '#4ae0a8', '#8a6cff', '#ff8c2e'];
    const pts = Array.from({ length: n }, (_, k) => { const a = k / n * Math.PI * 2 - Math.PI; return { x: C.x + Math.cos(a) * R, y: C.y + Math.sin(a) * R * .95 }; });
    const edges = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) edges.push([i, j]);
    edges.forEach(([i, j], k) => { const l = mk('path', { d: `M${pts[i].x} ${pts[i].y} Q ${C.x + (pts[i].x + pts[j].x - 2 * C.x) * .25} ${C.y + (pts[i].y + pts[j].y - 2 * C.y) * .25} ${pts[j].x} ${pts[j].y}`, stroke: '#ff8fb0', 'stroke-width': 3, fill: 'none', opacity: .35 }); net.appendChild(l); draw(l, .8 + k * .03, .5); edges[k].el = l; });
    const nodes = pts.map((p, k) => { const c = mk('circle', { cx: p.x, cy: p.y, r: 26, fill: '#ff5e8a', stroke: '#fff6e9', 'stroke-width': 6 }); c.classList.add('tb'); net.appendChild(c); popB(c, .5 + k * .08, '#ff8fb0', .5); return c; });
    /* input arrives for a while, then stops: the activity keeps going around on its own */
    const OFF = 8.8; [3, 4, 5, 6, 7, 8].forEach(k => snd('key', k, 1, .6)); [[6.4, .7], [9.4, 1], [11.1, .7], [13.3, .5]].forEach(([at, v]) => snd('whirl', at, 1, v));   /* the input knocks, then goes quiet; the going-round carries on */
    A(q(s, '.inp'), [{ opacity: 1 }, { opacity: .15 }], { at: OFF, dur: .6, fill: 'forwards' });
    const dots = Array.from({ length: 14 }, (_, k) => { const d = mk('circle', { r: 9, fill: cols[k % cols.length] }); net.appendChild(d); return { d, e: k % edges.length, dir: 1, p: (k * .37) % 1 }; });
    let prev = 0; const flash = new Array(n).fill(-9);
    cur.ticks.push(t => { const dt = Math.max(0, Math.min(.05, t - prev)); prev = t;
      dots.forEach((o, k) => { if (t < 2.4 + k * .12) { o.d.style.opacity = 0; return; } const el = edges[o.e].el, L = el.getTotalLength(); o.p += o.dir * dt * 320 / L;
        if (o.p > 1 || o.p < 0) { const at = o.p > 1 ? edges[o.e][1] : edges[o.e][0]; flash[at] = t; const opts = edges.map((e, ix) => [e, ix]).filter(([e, ix]) => ix !== o.e && (e[0] === at || e[1] === at));
          const [e, ix] = opts[(k * 7 + Math.floor(t * 13)) % opts.length]; o.e = ix; o.dir = e[0] === at ? 1 : -1; o.p = o.dir > 0 ? 0 : 1; }
        const pt = edges[o.e].el.getPointAtLength(Math.max(0, Math.min(1, o.p)) * L); o.d.setAttribute('cx', pt.x); o.d.setAttribute('cy', pt.y); o.d.style.opacity = 1; });
      /* while the input is on, it keeps knocking node 0 */
      if (t < OFF && t > 3) flash[0] = Math.max(flash[0], Math.floor(t));   /* once a second, where the key sounds are */
      nodes.forEach((c, k) => { const f = Math.max(0, 1 - (t - flash[k]) / .4); c.setAttribute('fill', f > .3 ? '#fff6e9' : '#ff5e8a'); c.setAttribute('r', 26 + 10 * f); });
    });
    refsIn(s, [10, 13.6]);
  }, '0 0 1680 600');

/* 2b. a network that remembers */
S('A network that remembers', 14, `It can also remember. Give every neuron a value it keeps from moment to moment, fading at its own pace: some forget at once, others hold on. So what happened a while ago still shapes what happens now.`,
  ...K4, `A network that <span class="hi-c">remembers.</span>`,
  `<g class="mem"></g>${REFS([['Hochreiter & Schmidhuber', 'LSTM memory cells', 1997], ['Randall Beer', 'evolved fading neurons', 1992]])}`,
  (s, svg) => {
    /* seven neurons, each with its own fade rate (shown as a jar). Two moments light them up; the fast ones forget, the slow ones still carry the past */
    const G = q(s, '.mem'), n = 7, half = [.25, .5, 1, 2, 4, 9, 60], X = i => 110 + i * 140, Y = 210;
    for (let i = 0; i < n - 1; i++) G.appendChild(mk('path', { d: `M${X(i) + 44} ${Y} H ${X(i + 1) - 44}`, stroke: '#ff8fb0', 'stroke-width': 4, opacity: .4 }));
    const parts = Array.from({ length: n }, (_, i) => { const g = mk('g'); G.appendChild(g);
      const glow = mk('circle', { cx: X(i), cy: Y, r: 70, fill: '#35d5f0', opacity: 0, filter: 'url(#bglowM)' });
      const node = mk('circle', { cx: X(i), cy: Y, r: 40, fill: '#3a3f7a', stroke: '#fff6e9', 'stroke-width': 6 });
      const jar = mk('rect', { x: X(i) - 30, y: Y + 90, width: 60, height: 170, rx: 14, fill: 'none', stroke: '#fff6e9', 'stroke-width': 5, opacity: .8 });
      const fillA = mk('rect', { x: X(i) - 24, y: Y + 254, width: 48, height: 0, rx: 9, fill: '#35d5f0' }), fillB = mk('rect', { x: X(i) - 24, y: Y + 254, width: 48, height: 0, rx: 9, fill: '#ff5e8a' });
      const speed = mk('text', { x: X(i), y: Y + 300, 'font-size': 26, fill: '#c9c6f2', 'text-anchor': 'middle' }); speed.textContent = ['', '', '', '', '', '', ''][i];
      g.append(glow, node, jar, fillA, fillB); [node, jar].forEach(el => el.classList.add('tb')); pop(node, .5 + i * .08, .5); pop(jar, .8 + i * .08, .5); return { glow, node, fillA, fillB }; });
    const defs = mk('defs'); defs.innerHTML = '<filter id="bglowM" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>'; svg.insertBefore(defs, svg.firstChild);
    /* two input moments: a cyan one that reaches every neuron, later a pink one that reaches only the first three */
    const IN1 = 3, IN2 = 11.2, wave = mk('rect', { x: 40, y: Y - 70, width: 30, height: 140, rx: 15, fill: '#35d5f0', opacity: 0 }); G.appendChild(wave);
    const wave2 = mk('rect', { x: 40, y: Y - 70, width: 30, height: 140, rx: 15, fill: '#ff5e8a', opacity: 0 }); G.appendChild(wave2);
    const sweep = (w, at, toX) => A(w, [{ opacity: 0, transform: 'translateX(0px)' }, { opacity: .85, transform: `translateX(${(toX - 40) * .15}px)`, offset: .15 }, { opacity: .85, transform: `translateX(${toX - 40}px)`, offset: .85 }, { opacity: 0, transform: `translateX(${toX - 40}px)` }], { at, dur: 1.1, ease: 'linear' });
    sweep(wave, IN1, X(n - 1)); sweep(wave2, IN2, X(2));
    const hit = (i, at, w) => at + (X(i) - 40) / (w - 40) * 1.1 * .7 + .15;
    /* each neuron sounds as it is lit: a short note for the ones that forget at once, a long ring for the ones that hold on */
    const NOTE = [0, 2, 4, 7, 9, 12, 14]; for (let i = 0; i < n; i++) { snd(i < 3 ? 'note' : 'ring', hit(i, IN1, X(n - 1)), st(NOTE[i]), .7); if (i < 3) snd('note', hit(i, IN2, X(2)), st(NOTE[i]), .8); }
    cur.ticks.push(t => parts.forEach((p, i) => {
      const lvl = (at, on) => { if (!on || t < at) return 0; return Math.pow(.5, (t - at) / half[i]); };
      const a = lvl(hit(i, IN1, X(n - 1)), true), b = lvl(hit(i, IN2, X(2)), i < 3), H = 230 * 0 + 160;
      p.fillA.setAttribute('height', (a * H).toFixed(1)); p.fillA.setAttribute('y', (Y + 254 - a * H).toFixed(1));
      p.fillB.setAttribute('height', (b * H).toFixed(1)); p.fillB.setAttribute('y', (Y + 254 - Math.max(a, b) * H).toFixed(1)); p.fillB.setAttribute('opacity', b > a ? 1 : 0);
      const v = Math.max(a, b), col = b > a ? '#ff5e8a' : '#35d5f0';
      p.glow.setAttribute('opacity', (v * .8).toFixed(3)); p.glow.setAttribute('fill', col); p.node.setAttribute('fill', v > .05 ? col : '#3a3f7a'); p.node.setAttribute('fill-opacity', (.35 + .65 * v).toFixed(3));
    }));
    refsIn(s, [8.7, 9.7]);
  }, '0 0 1680 600');

/* ---------- 26 OUTRO ---------- */
scenes.push({
  name: 'Outro', dur: 28, hold: 3, bg: 'forest-meadow',   /* 3 s more after the narrator, so the last idea sinks in */
  script: `Not one of these ideas is new. Scientists worked them out decades ago, and we are coming back to them now because the technology has finally caught up. We already know roughly how a mind that really thinks is made, because nature made us that way, and we survived by its rules. What we don't know is the details. So we have to let go of designing every part, and let it grow. That's the next video.`,
  build(r) {
    const CX = 450, CY = 300, LN = 'font-size:38px;margin-top:16px', IB = 'display:inline-block';

  else if (e.key === 'ArrowRight') load(idx + 1); else if (e.key === 'ArrowLeft') load(t > 1 ? idx : idx - 1);
  else if (e.key === 'Home') load(0); else if (e.key === 'End') load(scenes.length - 1);
  else if (e.key.toLowerCase() === 'k') document.body.classList.toggle('clean');
  else if (e.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (e.key.toLowerCase() === 'm') sfxOn = !sfxOn;
  else if (e.key.toLowerCase() === 'b') { musicOn = !musicOn; musicSet(); }
  else if (e.key === ',') { t = Math.max(0, t - 1); seekSfx(); sync(); } else if (e.key === '.') { t = Math.min(scenes[idx].dur, t + 1); seekSfx(); sync(); }
});

/* ---------- RENDER MODE (?render&clean): drives the player frame by frame for the MP4 export (tools/render_video.mjs) ----------
   A virtual clock replaces real time: performance.now, every CSS animation and transition, and the slide clock all follow it,
   so each frame is exact however slowly it is captured. Nothing is played: sounds are logged, and tools/mix_audio.py mixes
   the narration, the logged sound effects and the music offline. */
if (RENDER) {
  let VNOW = 0; performance.now = () => VNOW; const LOG = [];
  const seen = new WeakMap();
  /* endless CSS loops (twinkles, swaying plants, glows) follow the video clock itself, so every part of a parallel render has
     them at exactly the same phase; one-off transitions run from the moment they start */
  const sweep = () => { const ours = new Set(cur.anims); document.getAnimations().forEach(a => { if (ours.has(a)) return; let r = seen.get(a);
    if (!r) { const tm = a.effect && a.effect.getTiming ? a.effect.getTiming() : {}; r = { v0: VNOW, t0: a.currentTime || 0, loop: typeof CSSAnimation !== 'undefined' && a instanceof CSSAnimation && tm.iterations === Infinity }; seen.set(a, r); try { a.pause(); } catch (e) {} }
    try { a.currentTime = r.loop ? VNOW : r.t0 + (VNOW - r.v0); } catch (e) {} }); };
  (function keepSwept() { sweep(); requestAnimationFrame(keepSwept); })();   /* catch new transitions the moment they start */
  playSfx = function (name, rate = 1, vol = 1) { const key = name in KINDS ? `${name}-${setOf(idx)}` : name, pool = sfxPool[key];
    if (!sfxOn || !SFX_VOL || !pool) return; LOG.push([+(before(idx) + t).toFixed(4), key, +rate.toFixed(5), +Math.max(0, Math.min(1, SFX[name] * vol * SFX_VOL)).toFixed(4), pool.length]); };
  const settle = async (ms) => { await new Promise(r => setTimeout(r, ms)); await Promise.all([...document.images].map(im => im.complete ? 0 : im.decode().catch(() => 0))); };
  window.__render = {
    /* lock: the slide lengths measured once (render_info.json) are forced on this page, so every part of a parallel render
       uses exactly the same timeline, whatever this page managed to load; without it, a part whose page fell back to a
       placeholder length drifted away from the narration */
    async ready(lock) {
      await document.fonts.ready;
      if (lock) scenes.forEach((s, i) => { if (i === scenes.length - 1) return; const L = lock[i];
        s.adur = L.adur; Object.defineProperty(s, 'dur', { configurable: true, get: () => L.dur, set: () => {} }); });
      else { for (let k = 0; k < 600 && scenes.some(s => !s.noAudio && !s.adur); k++) await new Promise(r => setTimeout(r, 100));   /* every recording's length is known */
        const missing = scenes.filter(s => !s.noAudio && !s.adur).map(s => s.name); if (missing.length) throw new Error('recording lengths not loaded: ' + missing.join(', ')); }
      /* warm every image of every slide, and make sure each one really loaded (a busy local server can drop a request) */
      const urls = new Set(), grab = () => { document.querySelectorAll('img').forEach(im => im.src && urls.add(im.src)); document.querySelectorAll('image').forEach(im => { const h = im.getAttribute('href') || im.getAttribute('xlink:href'); if (h) urls.add(new URL(h, location.href).href); });
        document.querySelectorAll('.bg').forEach(b => { const m = /url\(["']?([^"')]+)/.exec(b.style.backgroundImage || ''); if (m) urls.add(new URL(m[1], location.href).href); }); };
      for (let i = 0; i < scenes.length; i++) { load(i); await settle(250); grab(); }
      const loadImg = u => new Promise(r => { const im = new Image(); im.onload = () => r(true); im.onerror = () => r(false); im.src = u; });
      const bad = [];
      for (const u of urls) { let ok = false; for (let k = 0; k < 5 && !ok; k++) { ok = await loadImg(u); if (!ok) await new Promise(r => setTimeout(r, 300)); } if (!ok && !/-far\.png|-trees\.png/.test(u)) bad.push(u); }   /* a place with no far/trees layer is fine */
      if (bad.length) throw new Error('images failed to load: ' + bad.join(', '));
      playing = true; VNOW = 0; load(0); t = 0; sync(); await settle(400); LOG.length = 0;
      return { total: total(), scenes: scenes.map((s, i) => ({ i, name: s.name, start: before(i), dur: s.dur, adur: s.adur || 0, file: s.adur ? audioFor(i) : null, bg: s.bg,
          seamless: !s.carry && !(s.parent && i > 0 && scenes[i - 1].parent === s.parent) })),   /* a part of the video may start here without a visible difference */
        music: { files: MUSIC, vol: MUSIC_VOL, problemTwo: before(scenes.findIndex(sc => sc.name === 'Problem two')), endStart: before(scenes.length - 1) } };
    },
    async frame(T) {
      VNOW = T * 1000; let i = 0; while (i < scenes.length - 1 && T >= before(i + 1)) i++;
      const changed = i !== idx; if (changed) load(i);
      t = Math.min(T - before(i), scenes[i].dur);
      for (const TT = t + scenes[idx].offset, sc = cur.score || []; cur.ci < sc.length && sc[cur.ci].at <= TT; cur.ci++) { const c = sc[cur.ci]; if (TT - c.at < .2) playSfx(c.name, c.rate, c.vol); }
      const ge = (VNOW - gustAt) / 1000; stageEl.style.setProperty('--g', (1 + 3.6 * (1 - Math.exp(-ge / .16)) * Math.exp(-ge / 1.1)).toFixed(3));
      sync(); sweep(); if (changed) { await settle(150); sweep(); }
      return idx;
    },
    /* a part rendered on its own starts with the slide before already on screen, its background settled, exactly as in one long render */
    async prime(T) { let i = 0; while (i < scenes.length - 1 && T >= before(i + 1)) i++; if (T <= 0) return;
      if (T - before(i) > .05) {   /* a part that starts in the middle of a slide: run that slide up to here, so its entrance and background have settled */
        const t0 = Math.max(before(i), T - 4); VNOW = t0 * 1000; load(i); gustAt = before(i) * 1000; t = t0 - before(i); sync(); sweep(); await settle(300);   /* the wind gust belongs to the slide's start */
        for (let x = t0; x < T; x += 1 / 30) { VNOW = x * 1000; t = x - before(i); sync(); }   /* step through, for anything that simulates frame by frame */
        VNOW = T * 1000 - 1; t = T - before(i) - .001; sync(); sweep(); await settle(100); sweep(); return; }
      if (i < 1) return;
      VNOW = Math.max(0, before(i) - 4) * 1000; load(i - 1); t = Math.max(0, scenes[i - 1].dur - 4); sync(); sweep(); await settle(300);
      VNOW = before(i) * 1000 - 1; sync(); sweep(); await settle(100); sweep(); },
    events: () => LOG
  };
}
// ?t=SECONDS seeks inside the scene (used for headless frame checks); ?clean hides the UI
const params = new URLSearchParams(location.search);
if (params.has('clean')) document.body.classList.add('clean');
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener('resize', fit); fit();
// stars
(function () { const s = document.getElementById('stars'); const cols = ['#ffd23f', '#ffe98a', '#b9f3dc', '#ffd23f']; let html = '<g class="drift">';
  for (let i = 0; i < 70; i++) html += `<circle class="tw" style="animation-duration:${(1.5 + Math.random() * 3).toFixed(2)}s;animation-delay:${(-Math.random() * 4).toFixed(2)}s" cx="${Math.random() * 1920}" cy="${Math.random() * 1080}" r="${Math.random() * 3 + 1}" fill="${cols[i % 4]}" opacity="${(Math.random() * .6 + .2).toFixed(2)}"/>`;
  html += '</g><g class="blobs">';
  const bc = ['#8a6cff', '#ff5e8a', '#35d5f0', '#ff8c2e'];
  for (let i = 0; i < 0; i++) html += `<circle class="blob" style="animation-duration:${(9 + i * 2.3).toFixed(1)}s;animation-delay:${(-i * 3.1).toFixed(1)}s" cx="${200 + i * 300}" cy="${200 + (i % 3) * 300}" r="${90 + (i % 3) * 50}" fill="${bc[i % 4]}" opacity=".07"/>`;
  s.innerHTML = html + '</g>'; })();
load((parseInt(location.hash.slice(1), 10) || 1) - 1);
if (params.has('t')) { t = parseFloat(params.get('t')) || 0; sync(); }
marks();
requestAnimationFrame(now => { last = now; requestAnimationFrame(frame); });
</script>
